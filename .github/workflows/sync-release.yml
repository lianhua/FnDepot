name: sync-release-fpk

on:
  schedule:
    - cron: "0 18 * * *"   # 每天 UTC 18:00 = 北京时间 02:00 检查上游
  workflow_dispatch:

env:
  RAW_BASE: https://raw.githubusercontent.com/lianhua/FnDepot/main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 同步上游 fpk 并更新索引
        run: python3 .github/scripts/sync.py

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变更，无需提交"
            exit 0
          fi
          git commit -m "chore(sync): update fpk packages from upstream"
          git push
          echo "已推送"
